<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ramSpreader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldBus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadowRam" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Green PCB Underlayer -->
  <rect x="20" y="40" width="460" height="150" rx="6" fill="#15803d" stroke="#166534" stroke-width="3" filter="url(#shadowRam)" />

  <!-- Gold Contact Pins (Bus Edge) at Bottom -->
  <g fill="url(#goldBus)">
    <!-- Left pin group (before notch) -->
    <rect x="35" y="170" width="200" height="26" rx="2" />
    <!-- Right pin group (after notch) -->
    <rect x="265" y="170" width="200" height="26" rx="2" />
  </g>

  <!-- Individual gold pin lines -->
  <g stroke="#a16207" stroke-width="1.5">
    <line x1="45" y1="170" x2="45" y2="196" /><line x1="60" y1="170" x2="60" y2="196" />
    <line x1="75" y1="170" x2="75" y2="196" /><line x1="90" y1="170" x2="90" y2="196" />
    <line x1="105" y1="170" x2="105" y2="196" /><line x1="120" y1="170" x2="120" y2="196" />
    <line x1="135" y1="170" x2="135" y2="196" /><line x1="150" y1="170" x2="150" y2="196" />
    <line x1="165" y1="170" x2="165" y2="196" /><line x1="180" y1="170" x2="180" y2="196" />
    <line x1="195" y1="170" x2="195" y2="196" /><line x1="210" y1="170" x2="210" y2="196" />
    <line x1="225" y1="170" x2="225" y2="196" />

    <line x1="275" y1="170" x2="275" y2="196" /><line x1="290" y1="170" x2="290" y2="196" />
    <line x1="305" y1="170" x2="305" y2="196" /><line x1="320" y1="170" x2="320" y2="196" />
    <line x1="335" y1="170" x2="335" y2="196" /><line x1="350" y1="170" x2="350" y2="196" />
    <line x1="365" y1="170" x2="365" y2="196" /><line x1="380" y1="170" x2="380" y2="196" />
    <line x1="395" y1="170" x2="395" y2="196" /><line x1="410" y1="170" x2="410" y2="196" />
    <line x1="425" y1="170" x2="425" y2="196" /><line x1="440" y1="170" x2="440" y2="196" />
    <line x1="455" y1="170" x2="455" y2="196" />
  </g>

  <!-- Key Notch (Celah Pengaman Kunci di Tengah Bawah) -->
  <path d="M 235,170 C 235,182 245,190 250,190 C 255,190 265,182 265,170 Z" fill="#0f172a" />

  <!-- Side Latch Notches (Klip Sayap Pengunci Ujung) -->
  <rect x="15" y="80" width="10" height="20" rx="3" fill="#0f172a" />
  <rect x="475" y="80" width="10" height="20" rx="3" fill="#0f172a" />

  <!-- Aluminum Heat Spreader Shield -->
  <path d="M 25,48 L 475,48 L 475,160 L 25,160 Z" fill="url(#ramSpreader)" stroke="#3f3f46" stroke-width="2" />

  <!-- Aggressive Top Ridges / Heatsink Fins -->
  <polygon points="35,48 55,28 85,28 95,48" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <polygon points="120,48 140,28 170,28 180,48" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <polygon points="320,48 330,28 360,28 380,48" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <polygon points="405,48 415,28 445,28 465,48" fill="#27272a" stroke="#52525b" stroke-width="1.5" />

  <!-- Red Accent Trim -->
  <polygon points="35,65 140,65 110,85 35,85" fill="#ef4444" />

  <!-- Brand Typography -->
  <text x="148" y="82" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="24" fill="#ffffff">FURY</text>
  <text x="228" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#a1a1aa">BEAST DDR4</text>

  <!-- White Specification Label Sticker -->
  <rect x="45" y="100" width="410" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="60" y="122" font-family="'Consolas', monospace" font-weight="bold" font-size="14" fill="#0f172a">KF432C16BB/16</text>
  <text x="60" y="138" font-family="'Consolas', monospace" font-size="11" fill="#475569">16GB 3200MHz CL16 1.35V 288-Pin DIMM</text>

  <!-- Barcode Simulation -->
  <g fill="#0f172a">
    <rect x="330" y="108" width="3" height="32" /><rect x="335" y="108" width="5" height="32" />
    <rect x="343" y="108" width="2" height="32" /><rect x="347" y="108" width="4" height="32" />
    <rect x="354" y="108" width="6" height="32" /><rect x="363" y="108" width="3" height="32" />
    <rect x="369" y="108" width="5" height="32" /><rect x="377" y="108" width="2" height="32" />
    <rect x="382" y="108" width="4" height="32" /><rect x="389" y="108" width="3" height="32" />
    <rect x="395" y="108" width="5" height="32" /><rect x="403" y="108" width="2" height="32" />
    <rect x="408" y="108" width="6" height="32" /><rect x="417" y="108" width="4" height="32" />
    <rect x="424" y="108" width="3" height="32" /><rect x="430" y="108" width="5" height="32" />
    <rect x="438" y="108" width="2" height="32" />
  </g>
</svg>
