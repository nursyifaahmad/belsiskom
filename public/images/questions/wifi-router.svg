<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="100%" height="100%">
  <defs>
    <linearGradient id="routerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="routerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 4 Tall External Omni-Directional Antennas -->
  <!-- Antenna 1 (Left tilted) -->
  <line x1="75" y1="210" x2="45" y2="40" stroke="#020617" stroke-width="12" stroke-linecap="round" />
  <circle cx="75" cy="210" r="10" fill="#334155" />

  <!-- Antenna 2 (Middle Left) -->
  <line x1="160" y1="200" x2="160" y2="30" stroke="#020617" stroke-width="12" stroke-linecap="round" />
  <circle cx="160" cy="200" r="10" fill="#334155" />

  <!-- Antenna 3 (Middle Right) -->
  <line x1="290" y1="200" x2="290" y2="30" stroke="#020617" stroke-width="12" stroke-linecap="round" />
  <circle cx="290" cy="200" r="10" fill="#334155" />

  <!-- Antenna 4 (Right tilted) -->
  <line x1="375" y1="210" x2="405" y2="40" stroke="#020617" stroke-width="12" stroke-linecap="round" />
  <circle cx="375" cy="210" r="10" fill="#334155" />

  <!-- Wi-Fi Radio Waves Visual Cue (Cyan Glowing Waves) -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.65">
    <path d="M 195,60 A 30,30 0 0,1 255,60" />
    <path d="M 180,45 A 50,50 0 0,1 270,45" />
    <path d="M 165,30 A 70,70 0 0,1 285,30" />
  </g>

  <!-- Router Aerodynamic Main Chassis -->
  <polygon points="50,220 400,220 430,290 20,290" fill="url(#routerBody)" stroke="#334155" stroke-width="3" filter="url(#routerShadow)" />

  <!-- Front Bezel Lip -->
  <rect x="20" y="290" width="410" height="30" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Top Geometric Texture Lines & Cooling Grilles -->
  <g stroke="#334155" stroke-width="2">
    <line x1="120" y1="235" x2="330" y2="235" />
    <line x1="100" y1="250" x2="350" y2="250" />
    <line x1="80" y1="265" x2="370" y2="265" />
  </g>

  <!-- Brand Logo Text -->
  <text x="225" y="275" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#38bdf8" text-anchor="middle">tp-link</text>
  <text x="225" y="295" font-family="'Consolas', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Wi-Fi 6 GIGABIT ROUTER</text>

  <!-- Front Status LED Indicators (Glowing Green Dots) -->
  <g fill="#22c55e">
    <circle cx="130" cy="305" r="4" />
    <circle cx="165" cy="305" r="4" />
    <circle cx="200" cy="305" r="4" />
    <circle cx="235" cy="305" r="4" />
    <circle cx="270" cy="305" r="4" />
    <circle cx="305" cy="305" r="4" />
  </g>
  <g fill="#94a3b8" font-family="'Consolas', monospace" font-size="9" text-anchor="middle">
    <text x="130" y="318">PWR</text>
    <text x="165" y="318">2.4G</text>
    <text x="200" y="318">5G</text>
    <text x="235" y="318">WAN</text>
    <text x="270" y="318">LAN</text>
    <text x="305" y="318">WPS</text>
  </g>

  <!-- Rear Gigabit LAN Ports Hint (Yellow Ports) -->
  <g fill="#facc15" stroke="#ca8a04" stroke-width="1.5">
    <rect x="150" y="202" width="22" height="15" rx="2" />
    <rect x="180" y="202" width="22" height="15" rx="2" />
    <rect x="210" y="202" width="22" height="15" rx="2" />
    <rect x="240" y="202" width="22" height="15" rx="2" />
  </g>
  <!-- 1 Blue WAN Internet Port -->
  <rect x="275" y="202" width="22" height="15" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5" />

  <text x="225" y="360" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#facc15" text-anchor="middle">WI-FI ROUTER (PERANGKAT KOMUNIKASI / JARINGAN)</text>
</svg>
