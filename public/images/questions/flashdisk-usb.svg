<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 250" width="100%" height="100%">
  <defs>
    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="usbBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="usbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Metal USB Plug (Konektor USB Tipe-A di Kiri) -->
  <rect x="50" y="80" width="90" height="90" rx="4" fill="url(#usbMetal)" stroke="#64748b" stroke-width="3" filter="url(#usbShadow)" />

  <!-- USB Plug Holes & Gold Pins Inside -->
  <rect x="75" y="98" width="18" height="22" rx="2" fill="#0f172a" />
  <rect x="75" y="130" width="18" height="22" rx="2" fill="#0f172a" />
  <rect x="110" y="98" width="22" height="54" rx="2" fill="#1e293b" />
  <!-- 4 Gold Pin Contacts Inside -->
  <line x1="115" y1="105" x2="128" y2="105" stroke="#facc15" stroke-width="3" />
  <line x1="115" y1="118" x2="128" y2="118" stroke="#facc15" stroke-width="3" />
  <line x1="115" y1="132" x2="128" y2="132" stroke="#facc15" stroke-width="3" />
  <line x1="115" y1="145" x2="128" y2="145" stroke="#facc15" stroke-width="3" />

  <!-- Flashdisk Main Body (Bodi Plastik Biru) -->
  <rect x="135" y="65" width="230" height="120" rx="16" fill="url(#usbBody)" stroke="#1e40af" stroke-width="3" filter="url(#usbShadow)" />

  <!-- Textured Grip Grooves on Body -->
  <line x1="155" y1="80" x2="155" y2="170" stroke="#60a5fa" stroke-width="2" />
  <line x1="165" y1="80" x2="165" y2="170" stroke="#60a5fa" stroke-width="2" />

  <!-- Brand & Storage Capacity Label -->
  <text x="260" y="115" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">SanDisk</text>
  <text x="260" y="148" font-family="'Consolas', monospace" font-weight="bold" font-size="20" fill="#facc15" text-anchor="middle">64 GB • USB 3.2</text>

  <!-- Blue Activity LED Indicator (Glow Dot) -->
  <circle cx="340" cy="125" r="5" fill="#38bdf8" />
  <circle cx="340" cy="125" r="9" fill="#38bdf8" opacity="0.4" />

  <!-- Keychain / Lanyard Loop Hole at Rear (Lubang Gantungan Kunci) -->
  <path d="M 365,85 C 400,85 400,165 365,165 Z" fill="#1e3a8a" stroke="#1e40af" stroke-width="3" />
  <circle cx="378" cy="125" r="10" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <text x="225" y="225" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#facc15" text-anchor="middle">FLASHDISK USB (STORAGE DEVICE)</text>
</svg>
