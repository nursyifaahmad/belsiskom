<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gpuShroud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="bracketMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="rtxGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="gpuShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="190" fill="#2563eb" opacity="0.12" filter="blur(35px)" />

  <g filter="url(#gpuShadow)">
    <!-- Rear Stainless Steel Bracket at Left (Colokan Casing Belakang) -->
    <rect x="40" y="75" width="22" height="260" rx="2" fill="url(#bracketMetal)" stroke="#64748b" stroke-width="2" />
    <!-- Top Mounting Screw Tab -->
    <path d="M 40,75 L 40,55 Q 40,50 48,50 L 58,50 L 62,75 Z" fill="url(#bracketMetal)" stroke="#64748b" stroke-width="1.5" />
    <circle cx="50" cy="62" r="3.5" fill="#0f172a" />

    <!-- Video Output Ports (1x HDMI + 3x DisplayPort) -->
    <rect x="44" y="115" width="14" height="28" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="51" y="132" font-family="'Consolas', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">DP1</text>

    <rect x="44" y="155" width="14" height="28" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="51" y="172" font-family="'Consolas', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">HDMI</text>

    <rect x="44" y="195" width="14" height="28" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="51" y="212" font-family="'Consolas', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">DP2</text>

    <rect x="44" y="235" width="14" height="28" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="51" y="252" font-family="'Consolas', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">DP3</text>

    <!-- Black PCB Backplate Platform -->
    <rect x="62" y="85" width="490" height="225" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Aluminum Dense Heatsink Fins (Exposed Edge) -->
    <g fill="#94a3b8">
      <rect x="75" y="70" width="460" height="20" rx="2" />
      <rect x="75" y="295" width="460" height="20" rx="2" />
    </g>

    <!-- Copper Heatpipes Glint -->
    <g stroke="#d97706" stroke-width="7" fill="none" stroke-linecap="round">
      <line x1="130" y1="80" x2="490" y2="80" />
      <line x1="150" y1="305" x2="470" y2="305" />
    </g>

    <!-- Main Shroud Body (ASUS Dual GeForce Geometric Facets) -->
    <rect x="70" y="90" width="475" height="210" rx="14" fill="url(#gpuShroud)" stroke="#475569" stroke-width="2" />

    <!-- Top Side Brand Stripe -->
    <rect x="180" y="90" width="220" height="12" fill="#020617" rx="2" />
    <text x="290" y="99" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">GEFORCE RTX™ • ASUS</text>

    <!-- Gold PCIe x16 Bus Pins at Bottom (Jalur Tancap ke Motherboard) -->
    <rect x="130" y="305" width="280" height="28" rx="2" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <!-- PCIe Key Notch -->
    <rect x="175" y="305" width="14" height="28" fill="#090d16" />
    <!-- PCIe Retention Lock Tail Clip -->
    <polygon points="410,305 430,305 420,333 410,333" fill="#cbd5e1" />
    <!-- Gold Pin Striations -->
    <g stroke="#ca8a04" stroke-width="1" opacity="0.6">
      <line x1="140" y1="307" x2="140" y2="331" /><line x1="150" y1="307" x2="150" y2="331" />
      <line x1="160" y1="307" x2="160" y2="331" /><line x1="170" y1="307" x2="170" y2="331" />
      <line x1="200" y1="307" x2="200" y2="331" /><line x1="220" y1="307" x2="220" y2="331" />
      <line x1="240" y1="307" x2="240" y2="331" /><line x1="260" y1="307" x2="260" y2="331" />
      <line x1="280" y1="307" x2="280" y2="331" /><line x1="300" y1="307" x2="300" y2="331" />
      <line x1="320" y1="307" x2="320" y2="331" /><line x1="340" y1="307" x2="340" y2="331" />
      <line x1="360" y1="307" x2="360" y2="331" /><line x1="380" y1="307" x2="380" y2="331" />
      <line x1="400" y1="307" x2="400" y2="331" />
    </g>

    <!-- Dual Axial-tech Cooling Fans -->
    <!-- Fan 1 (Left Fan - ASUS Hub) -->
    <circle cx="210" cy="195" r="78" fill="#020617" stroke="#334155" stroke-width="3" />
    <!-- Fan 1 Blades -->
    <g stroke="#334155" stroke-width="6" fill="none">
      <path d="M 210,165 Q 232,130 210,118" />
      <path d="M 238,181 Q 275,185 285,168" />
      <path d="M 231,215 Q 248,255 231,270" />
      <path d="M 197,224 Q 170,255 154,244" />
      <path d="M 181,190 Q 142,185 134,202" />
      <path d="M 190,170 Q 170,135 186,121" />
    </g>
    <!-- Center Hub -->
    <circle cx="210" cy="195" r="30" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
    <text x="210" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">ASUS</text>

    <!-- Fan 2 (Right Fan - GEFORCE Hub) -->
    <circle cx="410" cy="195" r="78" fill="#020617" stroke="#334155" stroke-width="3" />
    <!-- Fan 2 Blades -->
    <g stroke="#334155" stroke-width="6" fill="none">
      <path d="M 410,165 Q 432,130 410,118" />
      <path d="M 438,181 Q 475,185 485,168" />
      <path d="M 431,215 Q 448,255 431,270" />
      <path d="M 397,224 Q 370,255 354,244" />
      <path d="M 381,190 Q 342,185 334,202" />
      <path d="M 390,170 Q 370,135 386,121" />
    </g>
    <!-- Center Hub -->
    <circle cx="410" cy="195" r="30" fill="#0f172a" stroke="#22c55e" stroke-width="2" />
    <text x="410" y="199" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#22c55e" text-anchor="middle">GEFORCE</text>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="260" height="30" rx="15" fill="#f59e0b" opacity="0.2" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#fbbf24" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#fef3c7">KARTU GRAFIS (GPU / VGA CARD)</text>
  </g>

  <!-- PCIe x16 Badge at Bottom Right -->
  <g transform="translate(425, 395)">
    <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="72" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">PCIe 5.0 x16 8GB</text>
  </g>
</svg>