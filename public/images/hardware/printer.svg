<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="printBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="printShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="180" fill="#a855f7" opacity="0.1" filter="blur(30px)" />

  <g transform="translate(50, 0)">
    <!-- Rear Slanted Paper Feed Tray (Paper Input) -->
    <polygon points="120,40 380,40 350,110 150,110" fill="#64748b" stroke="#475569" stroke-width="2" />
    <!-- White Paper Sheet in Tray -->
    <polygon points="140,50 360,50 340,110 160,110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="200" y1="70" x2="300" y2="70" stroke="#94a3b8" stroke-width="2" />
    <line x1="180" y1="85" x2="320" y2="85" stroke="#94a3b8" stroke-width="2" />

    <!-- Main Printer Body (Epson EcoTank Style) -->
    <rect x="50" y="100" width="400" height="225" rx="16" fill="url(#printBody)" stroke="#94a3b8" stroke-width="3" filter="url(#printShadow)" />

    <!-- Black Flatbed Scanner Top Cover -->
    <rect x="65" y="105" width="370" height="30" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

    <!-- Brand Typography -->
    <text x="85" y="165" font-family="'Segoe UI', Arial" font-weight="900" font-size="22" fill="#1e3a8a">EPSON</text>
    <text x="170" y="165" font-family="'Consolas', monospace" font-size="12" fill="#475569">EcoTank L3210</text>

    <!-- Power & Control Buttons at Left -->
    <circle cx="85" cy="190" r="10" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
    <circle cx="115" cy="190" r="8" fill="#f59e0b" />
    <circle cx="140" cy="190" r="8" fill="#dc2626" />

    <!-- Front Paper Output Tray (Baki Kertas Keluar) -->
    <rect x="100" y="245" width="220" height="60" rx="6" fill="#475569" stroke="#334155" stroke-width="2" />
    <!-- Printed Paper Output -->
    <rect x="115" y="240" width="190" height="50" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Colorful Printed Lines -->
    <line x1="130" y1="255" x2="280" y2="255" stroke="#2563eb" stroke-width="3" />
    <line x1="130" y1="265" x2="250" y2="265" stroke="#16a34a" stroke-width="3" />
    <line x1="130" y1="275" x2="270" y2="275" stroke="#dc2626" stroke-width="3" />

    <!-- Integrated 4-Color Ink Tank Windows (EcoTank Feature at Right) -->
    <rect x="340" y="180" width="95" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Black Tank -->
    <rect x="348" y="200" width="16" height="85" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
    <!-- Yellow Tank -->
    <rect x="368" y="200" width="16" height="85" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1" />
    <!-- Magenta Tank -->
    <rect x="388" y="200" width="16" height="85" rx="3" fill="#ec4899" stroke="#db2777" stroke-width="1" />
    <!-- Cyan Tank -->
    <rect x="408" y="200" width="16" height="85" rx="3" fill="#06b6d4" stroke="#0891b2" stroke-width="1" />
    <text x="387" y="195" font-family="'Consolas', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">INK TANKS</text>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#a855f7" opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#c084fc" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#f3e8ff">PRINTER DOKUMEN (OUTPUT)</text>
  </g>

  <!-- Spec Badge at Bottom Right -->
  <g transform="translate(435, 395)">
    <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="67" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">4-INK ECOTANK</text>
  </g>
</svg>