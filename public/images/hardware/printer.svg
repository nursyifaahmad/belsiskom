<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="printBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="printShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="500" height="400" rx="16" fill="#090d16" />
  <circle cx="250" cy="200" r="160" fill="#a855f7" opacity="0.1" filter="blur(30px)" />

  <!-- Rear Slanted Paper Feed Tray (Paper Input) -->
  <polygon points="120,40 380,40 350,110 150,110" fill="#64748b" stroke="#475569" stroke-width="2" />
  <!-- White Paper Sheet in Tray -->
  <polygon points="140,50 360,50 340,110 160,110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="200" y1="70" x2="300" y2="70" stroke="#94a3b8" stroke-width="2" />
  <line x1="180" y1="85" x2="320" y2="85" stroke="#94a3b8" stroke-width="2" />

  <!-- Main Printer Body (Epson EcoTank Style) -->
  <rect x="50" y="100" width="400" height="200" rx="16" fill="url(#printBody)" stroke="#94a3b8" stroke-width="3" filter="url(#printShadow)" />

  <!-- Black Flatbed Scanner Top Cover -->
  <rect x="65" y="105" width="370" height="30" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

  <!-- Brand Typography -->
  <text x="85" y="165" font-family="'Segoe UI', Arial" font-weight="900" font-size="22" fill="#1e3a8a">EPSON</text>
  <text x="170" y="165" font-family="'Consolas', monospace" font-size="12" fill="#475569">EcoTank L3210</text>

  <!-- Power & Control Buttons at Left -->
  <circle cx="85" cy="190" r="10" fill="#22c55e" stroke="#16a34a" stroke-width="1.5" />
  <circle cx="115" cy="190" r="8" fill="#f59e0b" />
  <circle cx="140" cy="190" r="8" fill="#dc2626" />

  <!-- Front Paper Output Tray (Baki Kertas Keluar) -->
  <rect x="100" y="240" width="220" height="50" rx="6" fill="#475569" stroke="#334155" stroke-width="2" />
  <!-- Printed Paper Output -->
  <rect x="115" y="235" width="190" height="45" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Colorful Printed Lines -->
  <line x1="130" y1="248" x2="280" y2="248" stroke="#2563eb" stroke-width="3" />
  <line x1="130" y1="258" x2="250" y2="258" stroke="#16a34a" stroke-width="3" />
  <line x1="130" y1="268" x2="270" y2="268" stroke="#dc2626" stroke-width="3" />

  <!-- Integrated 4-Color Ink Tank Windows (EcoTank Feature at Right) -->
  <rect x="340" y="180" width="95" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <!-- Black Tank -->
  <rect x="348" y="200" width="16" height="70" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
  <!-- Yellow Tank -->
  <rect x="370" y="210" width="16" height="60" rx="3" fill="#eab308" />
  <!-- Magenta Tank -->
  <rect x="392" y="215" width="16" height="55" rx="3" fill="#ec4899" />
  <!-- Cyan Tank -->
  <rect x="414" y="205" width="16" height="65" rx="3" fill="#0284c7" />

  <text x="387" y="195" font-family="'Consolas', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">INK TANK (BK/Y/M/C)</text>

  <!-- Badge at Bottom -->
  <rect x="80" y="345" width="340" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="250" y="365" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#c084fc" text-anchor="middle">🖨️ EPSON ECOTANK L3210 INK TANK PRINTER</text>
</svg>
