<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 380" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="monShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Monitor Stand Base -->
  <rect x="150" y="320" width="150" height="18" rx="6" fill="#64748b" stroke="#475569" stroke-width="2" filter="url(#monShadow)" />
  <!-- Stand Neck Pole -->
  <rect x="210" y="240" width="30" height="90" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2" />

  <!-- Outer Monitor Bezel Frame -->
  <rect x="35" y="30" width="380" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="4" filter="url(#monShadow)" />

  <!-- Inner Active Display Panel (Windows 11 Screen) -->
  <rect x="45" y="40" width="360" height="200" rx="4" fill="url(#screenGrad)" />

  <!-- Windows 11 Bloom Ambient Art -->
  <ellipse cx="225" cy="130" rx="90" ry="50" fill="#38bdf8" opacity="0.35" />

  <!-- Active Application Window on Screen -->
  <rect x="80" y="65" width="290" height="135" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
  <!-- Title bar -->
  <rect x="80" y="65" width="290" height="24" rx="4" fill="#1e293b" />
  <circle cx="95" cy="77" r="4" fill="#ef4444" />
  <circle cx="110" cy="77" r="4" fill="#f59e0b" />
  <circle cx="125" cy="77" r="4" fill="#22c55e" />
  <text x="145" y="81" font-family="'Segoe UI', Arial" font-size="10" fill="#cbd5e1">BELSISKOM - Informatika SMP</text>

  <!-- Window Content lines -->
  <text x="100" y="115" font-family="'Segoe UI', Arial" font-weight="bold" font-size="14" fill="#38bdf8">Sistem Komputer Kelas 7</text>
  <text x="100" y="135" font-family="'Segoe UI', Arial" font-size="11" fill="#94a3b8">Menampilkan Output Visual ke Layar Monitor</text>
  <rect x="100" y="150" width="120" height="25" rx="4" fill="#2563eb" />
  <text x="160" y="166" font-family="'Segoe UI', Arial" font-weight="bold" font-size="11" fill="#fff" text-anchor="middle">Mulai Belajar ➔</text>

  <!-- Bottom Taskbar -->
  <rect x="45" y="222" width="360" height="18" fill="#090d16" />
  <g fill="#38bdf8">
    <circle cx="215" cy="231" r="3" />
    <circle cx="225" cy="231" r="3" />
    <circle cx="235" cy="231" r="3" />
  </g>

  <!-- LG/Monitor Brand Logo on Chin -->
  <text x="225" y="254" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#64748b" text-anchor="middle">MONITOR LAYAR (OUTPUT DEVICE)</text>
</svg>
