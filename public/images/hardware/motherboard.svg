<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="moboPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="silverHeatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="moboShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Motherboard ATX PCB -->
  <rect x="25" y="25" width="400" height="400" rx="14" fill="url(#moboPcb)" stroke="#1e3a8a" stroke-width="4" filter="url(#moboShadow)" />

  <!-- Mounting Screw Holes -->
  <circle cx="50" cy="50" r="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="400" cy="50" r="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="50" cy="400" r="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="400" cy="400" r="8" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />

  <!-- Copper Bus Traces Silkscreen (Subtle Circuit Lines) -->
  <g stroke="#1d4ed8" stroke-width="1" opacity="0.4">
    <line x1="160" y1="90" x2="270" y2="90" />
    <line x1="160" y1="110" x2="270" y2="110" />
    <line x1="160" y1="130" x2="270" y2="130" />
    <line x1="160" y1="150" x2="270" y2="150" />
    <line x1="110" y1="210" x2="110" y2="290" />
    <line x1="130" y1="210" x2="130" y2="290" />
    <line x1="150" y1="210" x2="150" y2="290" />
  </g>

  <!-- CPU Socket (LGA Metal Housing) -->
  <rect x="90" y="70" width="130" height="130" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="3" />
  <rect x="105" y="85" width="100" height="100" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <!-- LGA Socket Pin Bed -->
  <g fill="#ca8a04" opacity="0.6">
    <rect x="115" y="95" width="80" height="80" rx="2" />
  </g>
  <!-- Socket Metal Lever -->
  <line x1="225" y1="65" x2="225" y2="205" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <circle cx="225" cy="205" r="5" fill="#64748b" />

  <!-- Dual RAM Slots (DDR4 / DDR5) -->
  <!-- RAM Slot 1 -->
  <rect x="270" y="60" width="22" height="150" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <rect x="278" y="70" width="6" height="130" fill="#facc15" />
  <polygon points="266,55 276,55 276,65 266,65" fill="#f8fafc" />
  <polygon points="266,205 276,205 276,215 266,215" fill="#f8fafc" />

  <!-- RAM Slot 2 -->
  <rect x="305" y="60" width="22" height="150" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <rect x="313" y="70" width="6" height="130" fill="#facc15" />
  <polygon points="301,55 311,55 311,65 301,65" fill="#f8fafc" />
  <polygon points="301,205 311,205 311,215 301,215" fill="#f8fafc" />

  <text x="298" y="48" font-family="'Consolas', monospace" font-size="11" fill="#93c5fd" text-anchor="middle">DIMM SLOTS</text>

  <!-- VRM Heatsink Top & Left of CPU -->
  <rect x="90" y="40" width="130" height="22" rx="4" fill="url(#silverHeatsink)" stroke="#334155" stroke-width="2" />
  <rect x="45" y="70" width="35" height="130" rx="4" fill="url(#silverHeatsink)" stroke="#334155" stroke-width="2" />

  <!-- Solid Capacitors (Silver Cylinders) -->
  <g fill="#38bdf8" stroke="#0284c7" stroke-width="1.5">
    <circle cx="95" cy="225" r="7" />
    <circle cx="115" cy="225" r="7" />
    <circle cx="135" cy="225" r="7" />
    <circle cx="155" cy="225" r="7" />
    <circle cx="175" cy="225" r="7" />
  </g>

  <!-- PCIe x16 Slot (Panjang untuk Kartu Grafis VGA) -->
  <rect x="75" y="270" width="270" height="24" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
  <rect x="85" y="278" width="230" height="8" fill="#0f172a" />
  <!-- PCIe Lock Clip -->
  <polygon points="345,268 360,268 355,296 345,296" fill="#f8fafc" />
  <text x="200" y="312" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#60a5fa" text-anchor="middle">PCIe 5.0 x16 (GPU SLOT)</text>

  <!-- M.2 NVMe SSD Slot -->
  <rect x="120" y="235" width="180" height="18" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <rect x="290" y="238" width="8" height="12" fill="#facc15" />
  <text x="200" y="248" font-family="'Consolas', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">M.2 NVMe PCIe 4.0</text>

  <!-- Chipset Heatsink (Kanan Bawah) -->
  <rect x="270" y="325" width="105" height="80" rx="8" fill="url(#silverHeatsink)" stroke="#334155" stroke-width="2" />
  <text x="322" y="365" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">CHIPSET</text>
  <text x="322" y="385" font-family="'Consolas', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">B760 / X670</text>

  <!-- Rear I/O Panel Shield (Kiri Atas) -->
  <rect x="28" y="70" width="14" height="130" fill="#94a3b8" stroke="#475569" stroke-width="1" />
  <text x="210" y="420" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#facc15" text-anchor="middle">MOTHERBOARD (PAPAN INDUK KOMPUTER)</text>
</svg>
