<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="moboPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tufHeatsink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="tufGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="moboShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="225" r="210" fill="#1e3a8a" opacity="0.12" filter="blur(35px)" />

  <!-- Motherboard ATX PCB (Centered) -->
  <g filter="url(#moboShadow)">
    <rect x="110" y="25" width="380" height="395" rx="12" fill="url(#moboPcb)" stroke="#1e3a8a" stroke-width="3" />

    <!-- Mounting Screw Holes -->
    <circle cx="125" cy="40" r="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="475" cy="40" r="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="125" cy="405" r="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="475" cy="405" r="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- TUF GAMING VRM Heavy Heatsink (Top & Left of CPU) -->
    <!-- Top Heatsink -->
    <rect x="195" y="35" width="140" height="35" rx="4" fill="url(#tufHeatsink)" stroke="#64748b" stroke-width="1.5" />
    <rect x="200" y="38" width="130" height="4" fill="url(#tufGold)" />
    <!-- Left VRM Heatsink & Rear I/O Cover -->
    <rect x="118" y="70" width="48" height="150" rx="4" fill="url(#tufHeatsink)" stroke="#64748b" stroke-width="1.5" />
    <text x="142" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#e2e8f0" transform="rotate(-90 142 160)" letter-spacing="2">TUF GAMING</text>
    <rect x="122" y="75" width="4" height="135" fill="url(#tufGold)" />

    <!-- Rear I/O Ports Block (USB, HDMI, LAN, Audio) -->
    <rect x="112" y="80" width="8" height="130" fill="#94a3b8" />

    <!-- CPU Socket (LGA1700) -->
    <rect x="190" y="80" width="115" height="125" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5" />
    <rect x="202" y="92" width="90" height="100" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Pin Bed (Gold/Amber) -->
    <rect x="210" y="100" width="74" height="84" rx="2" fill="#ca8a04" opacity="0.6" />
    <!-- CPU Socket Metal Locking Lever -->
    <line x1="310" y1="78" x2="310" y2="208" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <circle cx="310" cy="208" r="4" fill="#64748b" />

    <!-- 4x DDR RAM Slots (Dual-Channel Black & Grey) -->
    <!-- Slot 1 -->
    <rect x="330" y="65" width="10" height="155" rx="2" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <rect x="333" y="75" width="4" height="135" fill="#facc15" />
    <!-- Slot 2 -->
    <rect x="345" y="65" width="10" height="155" rx="2" fill="#334155" stroke="#3b82f6" stroke-width="1" />
    <rect x="348" y="75" width="4" height="135" fill="#facc15" />
    <!-- Slot 3 -->
    <rect x="360" y="65" width="10" height="155" rx="2" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <rect x="363" y="75" width="4" height="135" fill="#facc15" />
    <!-- Slot 4 -->
    <rect x="375" y="65" width="10" height="155" rx="2" fill="#334155" stroke="#3b82f6" stroke-width="1" />
    <rect x="378" y="75" width="4" height="135" fill="#facc15" />
    <text x="355" y="55" font-family="'Consolas', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">DDR5 SLOTS</text>

    <!-- 24-Pin ATX Main Power Connector -->
    <rect x="445" y="100" width="30" height="85" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <g fill="#facc15">
      <rect x="448" y="105" width="10" height="75" rx="1" />
      <rect x="462" y="105" width="10" height="75" rx="1" />
    </g>

    <!-- PCIe 5.0 x16 Primary GPU SafeSlot (Reinforced Metal Shield) -->
    <rect x="145" y="240" width="220" height="18" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <rect x="155" y="244" width="200" height="10" fill="#020617" />
    <!-- PCIe Retention Latch Clip -->
    <rect x="365" y="237" width="15" height="24" rx="2" fill="#64748b" />
    <text x="250" y="233" font-family="'Consolas', monospace" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">PCIe 5.0 x16 GRAPHICS SLOT</text>

    <!-- M.2 NVMe Storage Armor Heatsink -->
    <rect x="145" y="270" width="180" height="30" rx="3" fill="url(#tufHeatsink)" stroke="#64748b" stroke-width="1.5" />
    <text x="235" y="289" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="middle">M.2 NVMe PCIe 4.0 HEATSINK</text>

    <!-- Secondary PCIe x16 & x1 Slots -->
    <rect x="145" y="320" width="220" height="14" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="145" y="350" width="100" height="12" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />

    <!-- Chipset B760 Heatsink (Bottom Right) -->
    <rect x="360" y="280" width="110" height="85" rx="6" fill="url(#tufHeatsink)" stroke="#64748b" stroke-width="2" />
    <rect x="370" y="290" width="90" height="65" fill="#0f172a" />
    <text x="415" y="322" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#facc15" text-anchor="middle">INTEL B760</text>
    <text x="415" y="338" font-family="'Consolas', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">CHIPSET</text>

    <!-- 4x SATA 6Gb/s Ports -->
    <g fill="#020617" stroke="#475569" stroke-width="1">
      <rect x="450" y="375" width="22" height="12" rx="1" />
      <rect x="450" y="392" width="22" height="12" rx="1" />
    </g>

    <!-- Audio Chipset Isolated Circuit Path (Bottom Left) -->
    <circle cx="140" cy="380" r="14" fill="#1e293b" stroke="#facc15" stroke-width="1.5" />
    <text x="140" y="384" font-family="'Consolas', monospace" font-size="8" fill="#facc15" text-anchor="middle">AUDIO</text>
  </g>
</svg>