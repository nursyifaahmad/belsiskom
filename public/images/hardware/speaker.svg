<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="woodCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="coneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <filter id="spkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="450" height="450" rx="16" fill="#090d16" />
  <circle cx="225" cy="225" r="160" fill="#a855f7" opacity="0.1" filter="blur(30px)" />

  <!-- Speaker Wooden Cabinet Enclosure (Edifier Style) -->
  <rect x="90" y="35" width="270" height="360" rx="16" fill="url(#woodCab)" stroke="#3f3f46" stroke-width="4" filter="url(#spkShadow)" />

  <!-- Front Inset Baffle Panel -->
  <rect x="108" y="52" width="234" height="326" rx="10" fill="#18181b" stroke="#27272a" stroke-width="2" />

  <!-- 1. Silk Dome Tweeter (Top Treble Speaker) -->
  <circle cx="225" cy="115" r="42" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <circle cx="225" cy="115" r="30" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <!-- Dome Center -->
  <circle cx="225" cy="115" r="18" fill="#38bdf8" opacity="0.9" />

  <!-- 2. Woofer Subwoofer (Large Bass Cone) -->
  <circle cx="225" cy="235" r="82" fill="#09090b" stroke="#3f3f46" stroke-width="3" filter="url(#spkShadow)" />
  <!-- Rubber Surround Ring -->
  <circle cx="225" cy="235" r="72" fill="none" stroke="#27272a" stroke-width="8" />
  <!-- Cone Diaphragm -->
  <circle cx="225" cy="235" r="62" fill="url(#coneGrad)" />
  <!-- Metal Dust Cap -->
  <circle cx="225" cy="235" r="26" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
  <ellipse cx="220" cy="228" rx="8" ry="4" fill="#ffffff" opacity="0.4" />

  <!-- 3. Front Bass Reflex Port (Air Vent Hole) -->
  <circle cx="160" cy="335" r="20" fill="#000000" stroke="#27272a" stroke-width="2" />
  <circle cx="160" cy="335" r="14" fill="#0f172a" />

  <!-- Volume Control Knob at Lower Right -->
  <circle cx="290" cy="335" r="16" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
  <line x1="290" y1="335" x2="290" y2="322" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Edifier Brand Text -->
  <text x="225" y="370" font-family="'Segoe UI', Arial" font-weight="900" font-size="14" fill="#a1a1aa" text-anchor="middle">EDIFIER • 42W RMS</text>

  <!-- Badge at Bottom -->
  <rect x="75" y="410" width="300" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="225" y="430" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">🔊 EDIFIER R1280T BOOKSHELF SPEAKERS</text>
</svg>
