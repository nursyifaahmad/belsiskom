<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Studio Background Glow -->
    <radialGradient id="cpuStudioGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Green Substrate PCB Gradient -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Nickel Plated Metal IHS Metallic Sheen -->
    <linearGradient id="ihsMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="ihsCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cpuDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />

  <!-- Blue Spotlight Halo Behind Processor -->
  <circle cx="300" cy="190" r="200" fill="url(#cpuStudioGlow)" />

  <!-- Studio Floor Pedestal / Reflection -->
  <ellipse cx="300" cy="375" rx="190" ry="22" fill="#000000" opacity="0.5" filter="blur(8px)" />

  <!-- PROCESSOR CHIP (LGA1700 Elongated Rectangular Form-Factor) -->
  <g filter="url(#cpuDropShadow)">
    
    <!-- 1. Multi-Layer Green Substrate PCB (37.5 x 45mm ratio) -->
    <rect x="185" y="45" width="230" height="290" rx="10" fill="url(#pcbGrad)" stroke="#14532d" stroke-width="3" />

    <!-- Alignment Notches on Side Edges -->
    <circle cx="185" cy="180" r="7" fill="#090d16" />
    <circle cx="415" cy="180" r="7" fill="#090d16" />

    <!-- Gold Triangle Notch Pin 1 (Bottom Left / Top Left) -->
    <polygon points="192,52 216,52 192,76" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Golden Surface Mount Test Pads (Gold Pins on PCB Border) -->
    <g fill="#facc15" opacity="0.9">
      <!-- Top Row -->
      <circle cx="230" cy="58" r="3" /><circle cx="248" cy="58" r="3" /><circle cx="266" cy="58" r="3" />
      <circle cx="334" cy="58" r="3" /><circle cx="352" cy="58" r="3" /><circle cx="370" cy="58" r="3" />
      <!-- Bottom Row -->
      <circle cx="210" cy="322" r="3" /><circle cx="228" cy="322" r="3" /><circle cx="246" cy="322" r="3" />
      <circle cx="354" cy="322" r="3" /><circle cx="372" cy="322" r="3" /><circle cx="390" cy="322" r="3" />
      <!-- Left Edge Pads -->
      <circle cx="195" cy="120" r="2.5" /><circle cx="195" cy="138" r="2.5" /><circle cx="195" cy="220" r="2.5" /><circle cx="195" cy="238" r="2.5" />
      <!-- Right Edge Pads -->
      <circle cx="405" cy="120" r="2.5" /><circle cx="405" cy="138" r="2.5" /><circle cx="405" cy="220" r="2.5" /><circle cx="405" cy="238" r="2.5" />
    </g>

    <!-- 2. Integrated Heat Spreader (IHS) - Nickel Plated Copper Shield -->
    <!-- Base Plate with LGA1700 "Winged" Shoulders -->
    <path d="M 215,70 L 385,70 Q 395,70 395,80 L 395,145 Q 402,150 402,160 L 402,220 Q 402,230 395,235 L 395,300 Q 395,310 385,310 L 215,310 Q 205,310 205,300 L 205,235 Q 198,230 198,220 L 198,160 Q 198,150 205,145 L 205,80 Q 205,70 215,70 Z" 
          fill="url(#ihsMetal)" stroke="#64748b" stroke-width="2.5" />

    <!-- Inner Elevated Contact Cap -->
    <rect x="220" y="82" width="160" height="216" rx="6" fill="url(#ihsMetal)" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="220" y="82" width="160" height="216" rx="6" fill="url(#ihsCap)" />

    <!-- 3. Authentic Laser Etched Markings -->
    <!-- Intel Logo -->
    <text x="300" y="125" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#1e293b" text-anchor="middle" letter-spacing="-1">intel®</text>

    <!-- Processor Family -->
    <text x="300" y="165" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#0f172a" text-anchor="middle">CORE™ i7</text>

    <!-- Model Number -->
    <text x="300" y="200" font-family="'Consolas', 'Courier New', monospace" font-weight="bold" font-size="22" fill="#1e293b" text-anchor="middle">i7-14700K</text>

    <!-- Technical Specs Subtext -->
    <text x="300" y="222" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">SRN07 3.40GHZ</text>
    <text x="300" y="238" font-family="'Consolas', monospace" font-size="11" fill="#475569" text-anchor="middle">LGA1700 • UP TO 5.60GHz</text>

    <!-- 2D DataMatrix Laser Matrix Code -->
    <rect x="245" y="250" width="34" height="34" fill="#0f172a" rx="2" />
    <g fill="#f8fafc">
      <rect x="248" y="253" width="5" height="5" />
      <rect x="256" y="253" width="5" height="5" />
      <rect x="270" y="253" width="5" height="5" />
      <rect x="248" y="262" width="5" height="5" />
      <rect x="264" y="262" width="5" height="5" />
      <rect x="256" y="272" width="5" height="5" />
      <rect x="270" y="272" width="5" height="5" />
    </g>

    <!-- Serial & Country of Origin -->
    <text x="290" y="262" font-family="'Consolas', monospace" font-size="9" fill="#475569">X338F921</text>
    <text x="290" y="276" font-family="'Consolas', monospace" font-size="9" fill="#475569">MALAYSIA</text>
    <text x="290" y="290" font-family="'Consolas', monospace" font-size="8" fill="#64748b">001 e4</text>

  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="210" height="30" rx="15" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#e0f2fe">CHIP PROCESSOR (CPU)</text>
  </g>

  <!-- LGA1700 Pin Badge at Bottom Right -->
  <g transform="translate(420, 395)">
    <rect width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="75" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">LGA1700 SOCKET</text>
  </g>
</svg>