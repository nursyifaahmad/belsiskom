<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="ihsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Green Substrate PCB -->
  <rect x="40" y="40" width="320" height="320" rx="16" fill="url(#pcbGrad)" stroke="#14532d" stroke-width="6" filter="url(#shadow)" />

  <!-- Gold Triangle Notch Pin 1 -->
  <polygon points="48,48 80,48 48,80" fill="#facc15" stroke="#ca8a04" stroke-width="2" />

  <!-- Alignment Notches on Edges -->
  <circle cx="40" cy="200" r="10" fill="#0f172a" />
  <circle cx="360" cy="200" r="10" fill="#0f172a" />

  <!-- Golden Contact Points (Micro SMD Pads) around perimeter -->
  <g fill="#facc15" opacity="0.85">
    <circle cx="90" cy="65" r="4" /><circle cx="115" cy="65" r="4" /><circle cx="140" cy="65" r="4" />
    <circle cx="260" cy="65" r="4" /><circle cx="285" cy="65" r="4" /><circle cx="310" cy="65" r="4" />
    <circle cx="90" cy="335" r="4" /><circle cx="115" cy="335" r="4" /><circle cx="140" cy="335" r="4" />
    <circle cx="260" cy="335" r="4" /><circle cx="285" cy="335" r="4" /><circle cx="310" cy="335" r="4" />
  </g>

  <!-- Metal IHS (Integrated Heat Spreader) Base -->
  <rect x="80" y="80" width="240" height="240" rx="12" fill="url(#ihsGrad)" stroke="#64748b" stroke-width="4" filter="url(#shadow)" />

  <!-- Inner Raised Core of IHS -->
  <rect x="100" y="100" width="200" height="200" rx="8" fill="url(#ihsGrad)" stroke="#94a3b8" stroke-width="2" />

  <!-- Laser Etched Typography -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#1e293b" text-anchor="middle">intel.</text>
  <text x="200" y="185" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="#0f172a" text-anchor="middle">CORE™ i7</text>
  <text x="200" y="220" font-family="'Consolas', monospace" font-weight="bold" font-size="22" fill="#334155" text-anchor="middle">i7-14700K</text>
  <text x="200" y="245" font-family="'Consolas', monospace" font-size="14" fill="#475569" text-anchor="middle">LGA1700 • 3.40GHz</text>

  <!-- 2D DataMatrix Simulation -->
  <rect x="180" y="255" width="40" height="40" fill="#0f172a" rx="3" />
  <g fill="#f8fafc">
    <rect x="184" y="259" width="6" height="6" />
    <rect x="194" y="259" width="6" height="6" />
    <rect x="210" y="259" width="6" height="6" />
    <rect x="184" y="271" width="6" height="6" />
    <rect x="202" y="271" width="6" height="6" />
    <rect x="194" y="283" width="6" height="6" />
    <rect x="210" y="283" width="6" height="6" />
  </g>

  <!-- Batch Serial at Bottom -->
  <text x="200" y="315" font-family="'Consolas', monospace" font-size="11" fill="#64748b" text-anchor="middle">BATCH #X338F921 • MALAYSIA</text>
</svg>
