<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="mouseShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="500" height="450" rx="16" fill="#090d16" />
  <circle cx="250" cy="200" r="160" fill="#38bdf8" opacity="0.1" filter="blur(30px)" />

  <!-- USB Cable at Top -->
  <path d="M 250,90 Q 250,30 200,20" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Mouse Shell (Logitech G102 Style) -->
  <path d="M 250,90 C 140,90 120,190 120,290 C 120,380 160,400 250,400 C 340,400 380,380 380,290 C 380,190 360,90 250,90 Z"
        fill="url(#mouseBody)" stroke="#475569" stroke-width="4" filter="url(#mouseShadow)" />

  <!-- Split Line for Left and Right Click -->
  <line x1="250" y1="90" x2="250" y2="225" stroke="#020617" stroke-width="3" />

  <!-- Ribbed Scroll Wheel (Biru) -->
  <rect x="236" y="125" width="28" height="60" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
  <line x1="236" y1="140" x2="264" y2="140" stroke="#93c5fd" stroke-width="2" />
  <line x1="236" y1="155" x2="264" y2="155" stroke="#93c5fd" stroke-width="2" />
  <line x1="236" y1="170" x2="264" y2="170" stroke="#93c5fd" stroke-width="2" />

  <!-- DPI Button Behind Scroll Wheel -->
  <rect x="240" y="200" width="20" height="24" rx="5" fill="#475569" stroke="#334155" stroke-width="1.5" />

  <!-- RGB Light Strip on Palm Rest -->
  <path d="M 160,300 C 160,370 340,370 340,300" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Logitech 'G' Logo on Palm Rest -->
  <path d="M 250,295 C 235,295 225,285 225,270 C 225,255 235,245 250,245 C 262,245 270,252 273,260 L 255,260 L 255,270 L 275,270 C 275,285 265,295 250,295 Z" fill="#38bdf8" />

  <!-- Badge at Bottom -->
  <rect x="100" y="410" width="300" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <text x="250" y="430" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8" text-anchor="middle">🖱️ LOGITECH G102 OPTICAL MOUSE</text>
</svg>
