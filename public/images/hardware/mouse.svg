<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="mouseShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="180" fill="#38bdf8" opacity="0.1" filter="blur(30px)" />

  <g transform="translate(50, 0)">
    <!-- USB Cable at Top -->
    <path d="M 250,80 Q 250,25 200,15" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" />

    <!-- Mouse Shell (Logitech G102 Style) -->
    <path d="M 250,80 C 140,80 120,180 120,280 C 120,370 160,390 250,390 C 340,390 380,370 380,280 C 380,180 360,80 250,80 Z"
          fill="url(#mouseBody)" stroke="#475569" stroke-width="4" filter="url(#mouseShadow)" />

    <!-- Split Line for Left and Right Click -->
    <line x1="250" y1="80" x2="250" y2="215" stroke="#020617" stroke-width="3" />

    <!-- Ribbed Scroll Wheel (Biru) -->
    <rect x="236" y="115" width="28" height="60" rx="12" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
    <line x1="236" y1="130" x2="264" y2="130" stroke="#93c5fd" stroke-width="2" />
    <line x1="236" y1="145" x2="264" y2="145" stroke="#93c5fd" stroke-width="2" />
    <line x1="236" y1="160" x2="264" y2="160" stroke="#93c5fd" stroke-width="2" />

    <!-- DPI Button Behind Scroll Wheel -->
    <rect x="240" y="190" width="20" height="24" rx="5" fill="#475569" stroke="#334155" stroke-width="1.5" />

    <!-- RGB Light Strip on Palm Rest -->
    <path d="M 160,290 C 160,360 340,360 340,290" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Logitech 'G' Logo on Palm Rest -->
    <path d="M 250,285 C 235,285 225,275 225,260 C 225,245 235,235 250,235 C 262,235 270,242 273,250 L 255,250 L 255,260 L 275,260 C 275,275 265,285 250,285 Z" fill="#38bdf8" />
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#e0f2fe">MOUSE OPTIK (INPUT DEVICE)</text>
  </g>

  <!-- Spec Badge at Bottom Right -->
  <g transform="translate(435, 395)">
    <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="67" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">8,000 DPI SENSOR</text>
  </g>
</svg>