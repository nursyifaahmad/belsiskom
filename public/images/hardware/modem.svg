<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="modemBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="modemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="450" height="450" rx="16" fill="#090d16" />
  <circle cx="225" cy="225" r="160" fill="#06b6d4" opacity="0.1" filter="blur(30px)" />

  <!-- Huawei / Fiber Modem Upright Stand Foot -->
  <rect x="140" y="360" width="170" height="24" rx="8" fill="#475569" stroke="#334155" stroke-width="2" filter="url(#modemShadow)" />

  <!-- Upright White Modem Tower Chassis -->
  <rect x="165" y="50" width="120" height="320" rx="14" fill="url(#modemBody)" stroke="#94a3b8" stroke-width="3" filter="url(#modemShadow)" />

  <!-- Side Cooling Ventilation Grooves -->
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="175" y1="120" x2="275" y2="120" />
    <line x1="175" y1="135" x2="275" y2="135" />
    <line x1="175" y1="150" x2="275" y2="150" />
    <line x1="175" y1="165" x2="275" y2="165" />
    <line x1="175" y1="180" x2="275" y2="180" />
  </g>

  <!-- Huawei Brand Logo at Top -->
  <g fill="#dc2626">
    <circle cx="225" cy="80" r="12" />
  </g>
  <text x="225" y="105" font-family="'Segoe UI', Arial" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">HUAWEI</text>

  <!-- Front Vertical LED Indicators -->
  <g font-family="'Consolas', monospace" font-size="10" font-weight="bold">
    <!-- Power LED (Green) -->
    <circle cx="195" cy="220" r="4.5" fill="#22c55e" />
    <text x="212" y="224" fill="#334155">POWER</text>

    <!-- PON Link LED (Green) -->
    <circle cx="195" cy="245" r="4.5" fill="#22c55e" />
    <text x="212" y="249" fill="#334155">PON</text>

    <!-- LOS LED (Red - Off / Normal) -->
    <circle cx="195" cy="270" r="4.5" fill="#475569" />
    <text x="212" y="274" fill="#94a3b8">LOS</text>

    <!-- Internet LED (Green) -->
    <circle cx="195" cy="295" r="4.5" fill="#22c55e" />
    <text x="212" y="299" fill="#334155">INTERNET</text>

    <!-- LAN LED (Green) -->
    <circle cx="195" cy="320" r="4.5" fill="#22c55e" />
    <text x="212" y="324" fill="#334155">LAN</text>
  </g>

  <!-- Green Fiber Optic SC/APC Port at Bottom Rear -->
  <rect x="290" y="320" width="35" height="30" rx="4" fill="#16a34a" stroke="#15803d" stroke-width="2" />
  <circle cx="307" cy="335" r="6" fill="#facc15" />
  <text x="345" y="340" font-family="'Consolas', monospace" font-size="10" fill="#4ade80">FIBER (SC/APC)</text>

  <!-- Badge at Bottom -->
  <rect x="60" y="410" width="330" height="30" rx="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="225" y="430" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="12" fill="#22d3ee" text-anchor="middle">🌐 HUAWEI HG8245H5 FIBER OPTIC MODEM</text>
</svg>
