<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="modemBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="modemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="180" fill="#06b6d4" opacity="0.1" filter="blur(30px)" />

  <g transform="translate(75, 0)">
    <!-- Huawei / Fiber Modem Upright Stand Foot -->
    <rect x="140" y="340" width="170" height="24" rx="8" fill="#475569" stroke="#334155" stroke-width="2" filter="url(#modemShadow)" />

    <!-- Upright White Modem Tower Chassis -->
    <rect x="165" y="40" width="120" height="310" rx="14" fill="url(#modemBody)" stroke="#94a3b8" stroke-width="3" filter="url(#modemShadow)" />

    <!-- Side Cooling Ventilation Grooves -->
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="175" y1="110" x2="275" y2="110" />
      <line x1="175" y1="125" x2="275" y2="125" />
      <line x1="175" y1="140" x2="275" y2="140" />
      <line x1="175" y1="155" x2="275" y2="155" />
      <line x1="175" y1="170" x2="275" y2="170" />
    </g>

    <!-- Huawei Brand Logo at Top -->
    <g fill="#dc2626">
      <circle cx="225" cy="70" r="12" />
    </g>
    <text x="225" y="95" font-family="'Segoe UI', Arial" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">HUAWEI</text>

    <!-- Front Vertical LED Indicators -->
    <g font-family="'Consolas', monospace" font-size="9" font-weight="bold">
      <!-- Power LED (Green) -->
      <circle cx="195" cy="205" r="4" fill="#22c55e" />
      <text x="210" y="209" fill="#334155">POWER</text>

      <!-- PON Link LED (Green) -->
      <circle cx="195" cy="225" r="4" fill="#22c55e" />
      <text x="210" y="229" fill="#334155">PON</text>

      <!-- LOS LED (Red - Off / Normal) -->
      <circle cx="195" cy="245" r="4" fill="#475569" />
      <text x="210" y="249" fill="#94a3b8">LOS</text>

      <!-- LAN LED (Green) -->
      <circle cx="195" cy="265" r="4" fill="#22c55e" />
      <text x="210" y="269" fill="#334155">LAN 1-4</text>

      <!-- WLAN / Wi-Fi LED -->
      <circle cx="195" cy="285" r="4" fill="#22c55e" />
      <text x="210" y="289" fill="#334155">WLAN</text>
    </g>

    <!-- Bottom Green SC/APC Optical Fiber Port -->
    <rect x="205" y="325" width="40" height="20" rx="3" fill="#15803d" stroke="#166534" stroke-width="1.5" />
    <circle cx="225" cy="335" r="5" fill="#facc15" />
    <text x="225" y="360" font-family="'Consolas', monospace" font-size="8" fill="#475569" text-anchor="middle">FIBER IN</text>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#06b6d4" opacity="0.2" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#22d3ee" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#cffafe">MODEM FIBER GPON (COMM)</text>
  </g>

  <!-- Spec Badge at Bottom Right -->
  <g transform="translate(435, 395)">
    <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="67" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">OPTICAL TERMINAL</text>
  </g>
</svg>