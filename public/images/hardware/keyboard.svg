<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="kbShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="#090d16" />
  <circle cx="300" cy="200" r="180" fill="#2563eb" opacity="0.1" filter="blur(30px)" />

  <!-- Keyboard Chassis (Logitech K120 Style) -->
  <g filter="url(#kbShadow)">
    <rect x="40" y="70" width="520" height="240" rx="14" fill="url(#kbBg)" stroke="#334155" stroke-width="3" />
    <rect x="55" y="85" width="490" height="210" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- USB Cable at Top -->
  <path d="M 300,70 L 300,20 Q 300,10 320,10 L 380,10" stroke="#0284c7" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Brand Logo & Status LEDs -->
  <text x="75" y="112" font-family="'Segoe UI', Arial" font-weight="900" font-size="16" fill="#38bdf8">logitech</text>
  <text x="145" y="112" font-family="'Consolas', monospace" font-size="12" fill="#64748b">K120 USB</text>

  <g fill="#22c55e">
    <circle cx="490" cy="108" r="4" /><circle cx="510" cy="108" r="4" />
  </g>
  <circle cx="530" cy="108" r="4" fill="#475569" />

  <!-- Function Keys Row (F1-F12) -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1.5" font-family="'Consolas', monospace" font-size="9" font-weight="bold">
    <rect x="70" y="125" width="30" height="22" rx="3" fill="#2563eb" /><text x="85" y="140" fill="#fff" text-anchor="middle">ESC</text>
    <rect x="110" y="125" width="26" height="22" rx="3" /><text x="123" y="140" fill="#cbd5e1" text-anchor="middle">F1</text>
    <rect x="140" y="125" width="26" height="22" rx="3" /><text x="153" y="140" fill="#cbd5e1" text-anchor="middle">F2</text>
    <rect x="170" y="125" width="26" height="22" rx="3" /><text x="183" y="140" fill="#cbd5e1" text-anchor="middle">F3</text>
    <rect x="200" y="125" width="26" height="22" rx="3" /><text x="213" y="140" fill="#cbd5e1" text-anchor="middle">F4</text>
    <rect x="240" y="125" width="26" height="22" rx="3" /><text x="253" y="140" fill="#cbd5e1" text-anchor="middle">F5</text>
    <rect x="270" y="125" width="26" height="22" rx="3" /><text x="283" y="140" fill="#cbd5e1" text-anchor="middle">F6</text>
    <rect x="300" y="125" width="26" height="22" rx="3" /><text x="313" y="140" fill="#cbd5e1" text-anchor="middle">F7</text>
    <rect x="330" y="125" width="26" height="22" rx="3" /><text x="343" y="140" fill="#cbd5e1" text-anchor="middle">F8</text>
    <rect x="370" y="125" width="26" height="22" rx="3" /><text x="383" y="140" fill="#cbd5e1" text-anchor="middle">F9</text>
    <rect x="400" y="125" width="26" height="22" rx="3" /><text x="413" y="140" fill="#cbd5e1" text-anchor="middle">F10</text>
    <rect x="430" y="125" width="26" height="22" rx="3" /><text x="443" y="140" fill="#cbd5e1" text-anchor="middle">F11</text>
    <rect x="460" y="125" width="26" height="22" rx="3" /><text x="473" y="140" fill="#cbd5e1" text-anchor="middle">F12</text>
    <rect x="495" y="125" width="35" height="22" rx="3" fill="#dc2626" /><text x="512" y="140" fill="#fff" text-anchor="middle">DEL</text>
  </g>

  <!-- Number Row -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
    <rect x="70" y="155" width="26" height="24" rx="3" /><text x="83" y="172" fill="#cbd5e1" text-anchor="middle">~</text>
    <rect x="100" y="155" width="26" height="24" rx="3" /><text x="113" y="172" fill="#cbd5e1" text-anchor="middle">1</text>
    <rect x="130" y="155" width="26" height="24" rx="3" /><text x="143" y="172" fill="#cbd5e1" text-anchor="middle">2</text>
    <rect x="160" y="155" width="26" height="24" rx="3" /><text x="173" y="172" fill="#cbd5e1" text-anchor="middle">3</text>
    <rect x="190" y="155" width="26" height="24" rx="3" /><text x="203" y="172" fill="#cbd5e1" text-anchor="middle">4</text>
    <rect x="220" y="155" width="26" height="24" rx="3" /><text x="233" y="172" fill="#cbd5e1" text-anchor="middle">5</text>
    <rect x="250" y="155" width="26" height="24" rx="3" /><text x="263" y="172" fill="#cbd5e1" text-anchor="middle">6</text>
    <rect x="280" y="155" width="26" height="24" rx="3" /><text x="293" y="172" fill="#cbd5e1" text-anchor="middle">7</text>
    <rect x="310" y="155" width="26" height="24" rx="3" /><text x="323" y="172" fill="#cbd5e1" text-anchor="middle">8</text>
    <rect x="340" y="155" width="26" height="24" rx="3" /><text x="353" y="172" fill="#cbd5e1" text-anchor="middle">9</text>
    <rect x="370" y="155" width="26" height="24" rx="3" /><text x="383" y="172" fill="#cbd5e1" text-anchor="middle">0</text>
    <rect x="400" y="155" width="48" height="24" rx="3" /><text x="424" y="172" fill="#cbd5e1" text-anchor="middle">BKSP</text>
    <rect x="455" y="155" width="75" height="24" rx="3" fill="#1e293b" /><text x="492" y="172" fill="#cbd5e1" text-anchor="middle">NUM PAD</text>
  </g>

  <!-- QWERTY Row -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
    <rect x="70" y="185" width="38" height="24" rx="3" /><text x="89" y="202" fill="#cbd5e1" text-anchor="middle">TAB</text>
    <rect x="112" y="185" width="26" height="24" rx="3" /><text x="125" y="202" fill="#93c5fd" text-anchor="middle">Q</text>
    <rect x="142" y="185" width="26" height="24" rx="3" /><text x="155" y="202" fill="#93c5fd" text-anchor="middle">W</text>
    <rect x="172" y="185" width="26" height="24" rx="3" /><text x="185" y="202" fill="#93c5fd" text-anchor="middle">E</text>
    <rect x="202" y="185" width="26" height="24" rx="3" /><text x="215" y="202" fill="#93c5fd" text-anchor="middle">R</text>
    <rect x="232" y="185" width="26" height="24" rx="3" /><text x="245" y="202" fill="#93c5fd" text-anchor="middle">T</text>
    <rect x="262" y="185" width="26" height="24" rx="3" /><text x="275" y="202" fill="#93c5fd" text-anchor="middle">Y</text>
    <rect x="292" y="185" width="26" height="24" rx="3" /><text x="305" y="202" fill="#93c5fd" text-anchor="middle">U</text>
    <rect x="322" y="185" width="26" height="24" rx="3" /><text x="335" y="202" fill="#93c5fd" text-anchor="middle">I</text>
    <rect x="352" y="185" width="26" height="24" rx="3" /><text x="365" y="202" fill="#93c5fd" text-anchor="middle">O</text>
    <rect x="382" y="185" width="26" height="24" rx="3" /><text x="395" y="202" fill="#93c5fd" text-anchor="middle">P</text>
    <rect x="415" y="185" width="55" height="24" rx="3" fill="#2563eb" /><text x="442" y="202" fill="#fff" text-anchor="middle">ENTER</text>
    <rect x="475" y="185" width="55" height="24" rx="3" /><text x="502" y="202" fill="#cbd5e1" text-anchor="middle">7  8  9</text>
  </g>

  <!-- ASDF Row -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
    <rect x="70" y="215" width="46" height="24" rx="3" /><text x="93" y="232" fill="#cbd5e1" text-anchor="middle">CAPS</text>
    <rect x="120" y="215" width="26" height="24" rx="3" /><text x="133" y="232" fill="#cbd5e1" text-anchor="middle">A</text>
    <rect x="150" y="215" width="26" height="24" rx="3" /><text x="163" y="232" fill="#cbd5e1" text-anchor="middle">S</text>
    <rect x="180" y="215" width="26" height="24" rx="3" /><text x="193" y="232" fill="#cbd5e1" text-anchor="middle">D</text>
    <rect x="210" y="215" width="26" height="24" rx="3" /><text x="223" y="232" fill="#cbd5e1" text-anchor="middle">F</text>
    <rect x="240" y="215" width="26" height="24" rx="3" /><text x="253" y="232" fill="#cbd5e1" text-anchor="middle">G</text>
    <rect x="270" y="215" width="26" height="24" rx="3" /><text x="283" y="232" fill="#cbd5e1" text-anchor="middle">H</text>
    <rect x="300" y="215" width="26" height="24" rx="3" /><text x="313" y="232" fill="#cbd5e1" text-anchor="middle">J</text>
    <rect x="330" y="215" width="26" height="24" rx="3" /><text x="343" y="232" fill="#cbd5e1" text-anchor="middle">K</text>
    <rect x="360" y="215" width="26" height="24" rx="3" /><text x="373" y="232" fill="#cbd5e1" text-anchor="middle">L</text>
    <rect x="390" y="215" width="80" height="24" rx="3" /><text x="430" y="232" fill="#cbd5e1" text-anchor="middle">SHIFT</text>
    <rect x="475" y="215" width="55" height="24" rx="3" /><text x="502" y="232" fill="#cbd5e1" text-anchor="middle">4  5  6</text>
  </g>

  <!-- Spacebar Row -->
  <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
    <rect x="70" y="245" width="38" height="26" rx="3" /><text x="89" y="262" fill="#cbd5e1" text-anchor="middle">CTRL</text>
    <rect x="112" y="245" width="32" height="26" rx="3" /><text x="128" y="262" fill="#38bdf8" text-anchor="middle">WIN</text>
    <rect x="148" y="245" width="32" height="26" rx="3" /><text x="164" y="262" fill="#cbd5e1" text-anchor="middle">ALT</text>
    <!-- Long Spacebar -->
    <rect x="184" y="245" width="200" height="26" rx="4" fill="#1e40af" stroke="#3b82f6" /><text x="284" y="262" fill="#ffffff" text-anchor="middle">SPACEBAR</text>
    <rect x="388" y="245" width="32" height="26" rx="3" /><text x="404" y="262" fill="#cbd5e1" text-anchor="middle">ALT</text>
    <rect x="424" y="245" width="46" height="26" rx="3" /><text x="447" y="262" fill="#cbd5e1" text-anchor="middle">CTRL</text>
    <rect x="475" y="245" width="55" height="26" rx="3" /><text x="502" y="262" fill="#cbd5e1" text-anchor="middle">1  2  3</text>
  </g>

  <!-- Badge at Bottom -->
  <rect x="150" y="345" width="300" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <text x="300" y="365" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#38bdf8" text-anchor="middle">⌨️ LOGITECH K120 USB KEYBOARD</text>
</svg>
