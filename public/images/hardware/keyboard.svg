<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="kbShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="190" fill="#2563eb" opacity="0.1" filter="blur(30px)" />

  <!-- USB Cable at Top -->
  <path d="M 300,80 L 300,30 Q 300,20 320,20 L 380,20" stroke="#0284c7" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Keyboard Chassis (Logitech K120 Style) -->
  <g filter="url(#kbShadow)">
    <rect x="40" y="80" width="520" height="240" rx="14" fill="url(#kbBg)" stroke="#334155" stroke-width="3" />
    <rect x="55" y="95" width="490" height="210" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="2" />

    <!-- Brand Logo & Status LEDs -->
    <text x="75" y="122" font-family="'Segoe UI', Arial" font-weight="900" font-size="16" fill="#38bdf8">logitech</text>
    <text x="145" y="122" font-family="'Consolas', monospace" font-size="12" fill="#64748b">K120 USB</text>

    <g fill="#22c55e">
      <circle cx="490" cy="118" r="4" /><circle cx="510" cy="118" r="4" />
    </g>
    <circle cx="530" cy="118" r="4" fill="#475569" />

    <!-- Function Keys Row (F1-F12) -->
    <g fill="#1e293b" stroke="#334155" stroke-width="1.5" font-family="'Consolas', monospace" font-size="9" font-weight="bold">
      <rect x="70" y="135" width="30" height="22" rx="3" fill="#2563eb" /><text x="85" y="150" fill="#fff" text-anchor="middle">ESC</text>
      <rect x="110" y="135" width="26" height="22" rx="3" /><text x="123" y="150" fill="#cbd5e1" text-anchor="middle">F1</text>
      <rect x="140" y="135" width="26" height="22" rx="3" /><text x="153" y="150" fill="#cbd5e1" text-anchor="middle">F2</text>
      <rect x="170" y="135" width="26" height="22" rx="3" /><text x="183" y="150" fill="#cbd5e1" text-anchor="middle">F3</text>
      <rect x="200" y="135" width="26" height="22" rx="3" /><text x="213" y="150" fill="#cbd5e1" text-anchor="middle">F4</text>
      <rect x="240" y="135" width="26" height="22" rx="3" /><text x="253" y="150" fill="#cbd5e1" text-anchor="middle">F5</text>
      <rect x="270" y="135" width="26" height="22" rx="3" /><text x="283" y="150" fill="#cbd5e1" text-anchor="middle">F6</text>
      <rect x="300" y="135" width="26" height="22" rx="3" /><text x="313" y="150" fill="#cbd5e1" text-anchor="middle">F7</text>
      <rect x="330" y="135" width="26" height="22" rx="3" /><text x="343" y="150" fill="#cbd5e1" text-anchor="middle">F8</text>
      <rect x="370" y="135" width="26" height="22" rx="3" /><text x="383" y="150" fill="#cbd5e1" text-anchor="middle">F9</text>
      <rect x="400" y="135" width="26" height="22" rx="3" /><text x="413" y="150" fill="#cbd5e1" text-anchor="middle">F10</text>
      <rect x="430" y="135" width="26" height="22" rx="3" /><text x="443" y="150" fill="#cbd5e1" text-anchor="middle">F11</text>
      <rect x="460" y="135" width="26" height="22" rx="3" /><text x="473" y="150" fill="#cbd5e1" text-anchor="middle">F12</text>
      <rect x="495" y="135" width="35" height="22" rx="3" fill="#dc2626" /><text x="512" y="150" fill="#fff" text-anchor="middle">DEL</text>
    </g>

    <!-- Number Row (1-0, -, =) -->
    <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Consolas', monospace" font-size="11" font-weight="bold">
      <rect x="70" y="165" width="24" height="24" rx="3" /><text x="82" y="181" fill="#94a3b8" text-anchor="middle">~</text>
      <rect x="98" y="165" width="24" height="24" rx="3" /><text x="110" y="181" fill="#fff" text-anchor="middle">1</text>
      <rect x="126" y="165" width="24" height="24" rx="3" /><text x="138" y="181" fill="#fff" text-anchor="middle">2</text>
      <rect x="154" y="165" width="24" height="24" rx="3" /><text x="166" y="181" fill="#fff" text-anchor="middle">3</text>
      <rect x="182" y="165" width="24" height="24" rx="3" /><text x="194" y="181" fill="#fff" text-anchor="middle">4</text>
      <rect x="210" y="165" width="24" height="24" rx="3" /><text x="222" y="181" fill="#fff" text-anchor="middle">5</text>
      <rect x="238" y="165" width="24" height="24" rx="3" /><text x="250" y="181" fill="#fff" text-anchor="middle">6</text>
      <rect x="266" y="165" width="24" height="24" rx="3" /><text x="278" y="181" fill="#fff" text-anchor="middle">7</text>
      <rect x="294" y="165" width="24" height="24" rx="3" /><text x="306" y="181" fill="#fff" text-anchor="middle">8</text>
      <rect x="322" y="165" width="24" height="24" rx="3" /><text x="334" y="181" fill="#fff" text-anchor="middle">9</text>
      <rect x="350" y="165" width="24" height="24" rx="3" /><text x="362" y="181" fill="#fff" text-anchor="middle">0</text>
      <rect x="378" y="165" width="24" height="24" rx="3" /><text x="390" y="181" fill="#94a3b8" text-anchor="middle">-</text>
      <rect x="406" y="165" width="24" height="24" rx="3" /><text x="418" y="181" fill="#94a3b8" text-anchor="middle">=</text>
      <rect x="434" y="165" width="45" height="24" rx="3" fill="#334155" /><text x="456" y="181" fill="#fff" text-anchor="middle">BACK</text>
      <rect x="485" y="165" width="45" height="24" rx="3" fill="#1e293b" /><text x="507" y="181" fill="#38bdf8" text-anchor="middle">NUM</text>
    </g>

    <!-- QWERTY Row -->
    <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
      <rect x="70" y="195" width="35" height="24" rx="3" fill="#334155" /><text x="87" y="211" fill="#cbd5e1" text-anchor="middle">TAB</text>
      <rect x="109" y="195" width="24" height="24" rx="3" /><text x="121" y="211" fill="#fff" text-anchor="middle">Q</text>
      <rect x="137" y="195" width="24" height="24" rx="3" /><text x="149" y="211" fill="#fff" text-anchor="middle">W</text>
      <rect x="165" y="195" width="24" height="24" rx="3" /><text x="177" y="211" fill="#fff" text-anchor="middle">E</text>
      <rect x="193" y="195" width="24" height="24" rx="3" /><text x="205" y="211" fill="#fff" text-anchor="middle">R</text>
      <rect x="221" y="195" width="24" height="24" rx="3" /><text x="233" y="211" fill="#fff" text-anchor="middle">T</text>
      <rect x="249" y="195" width="24" height="24" rx="3" /><text x="261" y="211" fill="#fff" text-anchor="middle">Y</text>
      <rect x="277" y="195" width="24" height="24" rx="3" /><text x="289" y="211" fill="#fff" text-anchor="middle">U</text>
      <rect x="305" y="195" width="24" height="24" rx="3" /><text x="317" y="211" fill="#fff" text-anchor="middle">I</text>
      <rect x="333" y="195" width="24" height="24" rx="3" /><text x="345" y="211" fill="#fff" text-anchor="middle">O</text>
      <rect x="361" y="195" width="24" height="24" rx="3" /><text x="373" y="211" fill="#fff" text-anchor="middle">P</text>
      <rect x="389" y="195" width="24" height="24" rx="3" /><text x="401" y="211" fill="#94a3b8" text-anchor="middle">[</text>
      <rect x="417" y="195" width="24" height="24" rx="3" /><text x="429" y="211" fill="#94a3b8" text-anchor="middle">]</text>
      <rect x="445" y="195" width="34" height="24" rx="3" /><text x="462" y="211" fill="#94a3b8" text-anchor="middle">\</text>
      <rect x="485" y="195" width="45" height="24" rx="3" fill="#1e293b" /><text x="507" y="211" fill="#cbd5e1" text-anchor="middle">7  8  9</text>
    </g>

    <!-- ASDF Row -->
    <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
      <rect x="70" y="225" width="42" height="24" rx="3" fill="#334155" /><text x="91" y="241" fill="#cbd5e1" text-anchor="middle">CAPS</text>
      <rect x="116" y="225" width="24" height="24" rx="3" /><text x="128" y="241" fill="#fff" text-anchor="middle">A</text>
      <rect x="144" y="225" width="24" height="24" rx="3" /><text x="156" y="241" fill="#fff" text-anchor="middle">S</text>
      <rect x="172" y="225" width="24" height="24" rx="3" /><text x="184" y="241" fill="#fff" text-anchor="middle">D</text>
      <rect x="200" y="225" width="24" height="24" rx="3" /><text x="212" y="241" fill="#fff" text-anchor="middle">F</text>
      <rect x="228" y="225" width="24" height="24" rx="3" /><text x="240" y="241" fill="#fff" text-anchor="middle">G</text>
      <rect x="256" y="225" width="24" height="24" rx="3" /><text x="268" y="241" fill="#fff" text-anchor="middle">H</text>
      <rect x="284" y="225" width="24" height="24" rx="3" /><text x="296" y="241" fill="#fff" text-anchor="middle">J</text>
      <rect x="312" y="225" width="24" height="24" rx="3" /><text x="324" y="241" fill="#fff" text-anchor="middle">K</text>
      <rect x="340" y="225" width="24" height="24" rx="3" /><text x="352" y="241" fill="#fff" text-anchor="middle">L</text>
      <rect x="368" y="225" width="24" height="24" rx="3" /><text x="380" y="241" fill="#94a3b8" text-anchor="middle">;</text>
      <rect x="396" y="225" width="24" height="24" rx="3" /><text x="408" y="241" fill="#94a3b8" text-anchor="middle">'</text>
      <rect x="424" y="225" width="55" height="24" rx="3" fill="#2563eb" /><text x="451" y="241" fill="#fff" text-anchor="middle">ENTER</text>
      <rect x="485" y="225" width="45" height="24" rx="3" fill="#1e293b" /><text x="507" y="241" fill="#cbd5e1" text-anchor="middle">4  5  6</text>
    </g>

    <!-- Spacebar Row -->
    <g fill="#0f172a" stroke="#1e293b" stroke-width="1.5" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">
      <rect x="70" y="255" width="38" height="26" rx="3" /><text x="89" y="272" fill="#cbd5e1" text-anchor="middle">CTRL</text>
      <rect x="112" y="255" width="32" height="26" rx="3" /><text x="128" y="272" fill="#38bdf8" text-anchor="middle">WIN</text>
      <rect x="148" y="255" width="32" height="26" rx="3" /><text x="164" y="272" fill="#cbd5e1" text-anchor="middle">ALT</text>
      <!-- Long Spacebar -->
      <rect x="184" y="255" width="200" height="26" rx="4" fill="#1e40af" stroke="#3b82f6" /><text x="284" y="272" fill="#ffffff" text-anchor="middle">SPACEBAR</text>
      <rect x="388" y="255" width="32" height="26" rx="3" /><text x="404" y="272" fill="#cbd5e1" text-anchor="middle">ALT</text>
      <rect x="424" y="255" width="46" height="26" rx="3" /><text x="447" y="272" fill="#cbd5e1" text-anchor="middle">CTRL</text>
      <rect x="475" y="255" width="55" height="26" rx="3" /><text x="502" y="272" fill="#cbd5e1" text-anchor="middle">1  2  3</text>
    </g>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#3b82f6" opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#60a5fa" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#dbeafe">KEYBOARD USB QWERTY (INPUT)</text>
  </g>

  <!-- Spec Badge at Bottom Right -->
  <g transform="translate(435, 395)">
    <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="67" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">104 TOMBOL USB</text>
  </g>
</svg>