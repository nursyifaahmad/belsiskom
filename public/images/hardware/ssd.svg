<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Dark PCB Gradient -->
    <linearGradient id="ssdBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Nickel Plated Controller Shield -->
    <linearGradient id="nickelController" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Gold M.2 Connector Pins -->
    <linearGradient id="m2Pins" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="ssdShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="180" fill="#0284c7" opacity="0.12" filter="blur(35px)" />

  <g filter="url(#ssdShadow)">
    <!-- M.2 2280 PCB Stick Base (22mm x 80mm Proportional Ratio) -->
    <rect x="50" y="145" width="500" height="150" rx="6" fill="url(#ssdBg)" stroke="#334155" stroke-width="2" />

    <!-- Gold M.2 Connector Pins at Left Edge (Key M 75 Pins) -->
    <rect x="35" y="155" width="22" height="130" rx="2" fill="url(#m2Pins)" stroke="#ca8a04" stroke-width="1" />
    <!-- M.2 Key M Notch (Celah Colokan Slot M.2) -->
    <rect x="35" y="180" width="22" height="18" fill="#090d16" />
    <!-- Gold Pin Striations -->
    <g stroke="#a16207" stroke-width="1" opacity="0.6">
      <line x1="38" y1="160" x2="52" y2="160" /><line x1="38" y1="166" x2="52" y2="166" />
      <line x1="38" y1="172" x2="52" y2="172" /><line x1="38" y1="205" x2="52" y2="205" />
      <line x1="38" y1="215" x2="52" y2="215" /><line x1="38" y1="225" x2="52" y2="225" />
      <line x1="38" y1="235" x2="52" y2="235" /><line x1="38" y1="245" x2="52" y2="245" />
      <line x1="38" y1="255" x2="52" y2="255" /><line x1="38" y1="265" x2="52" y2="265" />
      <line x1="38" y1="275" x2="52" y2="275" />
    </g>

    <!-- Semi-Circular Mounting Screw Notch at Right Edge -->
    <circle cx="550" cy="220" r="14" fill="#090d16" stroke="#334155" stroke-width="2" />

    <!-- Samsung Elpida Nickel-Coated High Performance Controller Chip -->
    <rect x="80" y="165" width="75" height="75" rx="5" fill="url(#nickelController)" stroke="#64748b" stroke-width="2" />
    <text x="117" y="198" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10" fill="#0f172a" text-anchor="middle">SAMSUNG</text>
    <text x="117" y="215" font-family="'Consolas', monospace" font-size="8.5" fill="#334155" text-anchor="middle">ELPIDA CONTROLLER</text>
    <text x="117" y="228" font-family="'Consolas', monospace" font-size="7.5" fill="#475569" text-anchor="middle">NICKEL COATED</text>

    <!-- DRAM Cache Chip -->
    <rect x="80" y="248" width="75" height="36" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="117" y="270" font-family="'Consolas', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">DRAM LPDDR4 1GB</text>

    <!-- Samsung 980 PRO Official Thermal Label Sticker -->
    <rect x="170" y="155" width="365" height="130" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5" />

    <!-- Orange Copper Heat Dissipating Stripe -->
    <rect x="170" y="155" width="365" height="9" fill="#ea580c" />

    <!-- Samsung Brand Typography -->
    <text x="185" y="195" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1">SAMSUNG</text>
    <text x="325" y="195" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ef4444">980 PRO</text>
    <text x="445" y="195" font-family="'Consolas', monospace" font-weight="bold" font-size="15" fill="#cbd5e1">NVMe™ M.2</text>

    <!-- Technical Specs Line -->
    <text x="185" y="222" font-family="'Consolas', monospace" font-weight="bold" font-size="13" fill="#38bdf8">PCIe® 4.0 NVMe™ M.2 SSD • 1TB CAPACITY</text>
    <text x="185" y="242" font-family="'Consolas', monospace" font-size="11" fill="#94a3b8">BACA HINGGA: 7,000 MB/s • TULIS: 5,000 MB/s</text>
    <text x="185" y="258" font-family="'Consolas', monospace" font-size="9" fill="#64748b">MODEL: MZ-V8P1T0 • S/N: S5GXNX0T104829K • RATED DC+3.3V 2.9A</text>

    <!-- Authenticity Barcode Simulation -->
    <g fill="#ffffff">
      <rect x="185" y="266" width="2" height="14" /><rect x="190" y="266" width="4" height="14" />
      <rect x="197" y="266" width="3" height="14" /><rect x="203" y="266" width="5" height="14" />
      <rect x="211" y="266" width="2" height="14" /><rect x="216" y="266" width="4" height="14" />
      <rect x="223" y="266" width="1" height="14" /><rect x="227" y="266" width="3" height="14" />
      <rect x="233" y="266" width="4" height="14" /><rect x="240" y="266" width="2" height="14" />
      <rect x="245" y="266" width="5" height="14" /><rect x="253" y="266" width="3" height="14" />
      <rect x="259" y="266" width="1" height="14" /><rect x="263" y="266" width="4" height="14" />
      <rect x="270" y="266" width="2" height="14" />
    </g>
    <text x="285" y="278" font-family="'Consolas', monospace" font-size="8.5" fill="#64748b">V-NAND 3-bit MLC</text>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#e0f2fe">SSD M.2 NVMe (STORAGE)</text>
  </g>

  <!-- Form Factor Badge at Bottom Right -->
  <g transform="translate(425, 395)">
    <rect width="145" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="72" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">M.2 2280 PCIe 4.0</text>
  </g>
</svg>