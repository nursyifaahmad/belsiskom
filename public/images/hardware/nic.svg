<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nicPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="nicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Studio Background -->
  <rect width="600" height="450" rx="16" fill="#090d16" />
  <circle cx="300" cy="210" r="180" fill="#06b6d4" opacity="0.1" filter="blur(30px)" />

  <g transform="translate(50, 0)">
    <!-- Silver Metal Chassis Bracket at Left -->
    <rect x="40" y="45" width="20" height="310" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
    <rect x="38" y="325" width="24" height="40" rx="2" fill="#94a3b8" />
    <circle cx="50" cy="65" r="5" fill="#0f172a" />

    <!-- Green PCB Body -->
    <rect x="60" y="90" width="400" height="230" rx="8" fill="url(#nicPcb)" stroke="#166534" stroke-width="2" filter="url(#nicShadow)" />

    <!-- Gold PCIe x1 Bus Edge Pins at Bottom -->
    <rect x="110" y="320" width="150" height="26" rx="2" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <rect x="145" y="320" width="12" height="26" fill="#090d16" />

    <!-- Shielded Metal RJ-45 Ethernet Jack -->
    <rect x="45" y="150" width="90" height="90" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <!-- RJ-45 Port Socket Hole -->
    <rect x="42" y="165" width="45" height="60" rx="3" fill="#0f172a" />
    <!-- 8 Gold Contact Pins inside RJ-45 socket -->
    <g stroke="#facc15" stroke-width="2">
      <line x1="50" y1="174" x2="68" y2="174" /><line x1="50" y1="180" x2="68" y2="180" />
      <line x1="50" y1="186" x2="68" y2="186" /><line x1="50" y1="192" x2="68" y2="192" />
      <line x1="50" y1="198" x2="68" y2="198" /><line x1="50" y1="204" x2="68" y2="204" />
      <line x1="50" y1="210" x2="68" y2="210" /><line x1="50" y1="216" x2="68" y2="216" />
    </g>

    <!-- RJ-45 Link Status LEDs (Green Link & Amber Activity) -->
    <circle cx="105" cy="162" r="4.5" fill="#22c55e" />
    <circle cx="122" cy="162" r="4.5" fill="#f59e0b" />

    <!-- Realtek Gigabit Ethernet Controller Chip -->
    <rect x="180" y="150" width="80" height="80" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="220" y="185" font-family="'Consolas', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">REALTEK</text>
    <text x="220" y="202" font-family="'Consolas', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">RTL8111H</text>

    <!-- LAN Pulse Transformer Magnetics Block -->
    <rect x="145" y="155" width="28" height="58" rx="3" fill="#18181b" stroke="#334155" stroke-width="1.5" />

    <!-- TP-Link Brand Silkscreen -->
    <text x="320" y="130" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff">tp-link</text>
    <text x="320" y="150" font-family="'Consolas', monospace" font-size="11" fill="#86efac">TG-3468 Gigabit PCIe</text>
    <text x="320" y="170" font-family="'Consolas', monospace" font-size="9" fill="#d1fae5">10/100/1000 Mbps NIC</text>
  </g>

  <!-- Clear Badge Overlay in Visual -->
  <g transform="translate(30, 395)">
    <rect width="250" height="30" rx="15" fill="#06b6d4" opacity="0.2" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#22d3ee" />
    <text x="30" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#cffafe">KARTU JARINGAN NIC (COMM)</text>
  </g>

  <!-- Spec Badge at Bottom Right -->
  <g transform="translate(435, 395)">
    <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="67" y="20" font-family="'Consolas', monospace" font-weight="bold" font-size="11" fill="#94a3b8" text-anchor="middle">GIGABIT PCIe x1</text>
  </g>
</svg>